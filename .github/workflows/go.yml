name: Go

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify module checksums
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -count=1 '-coverpkg=./...' '-coverprofile=coverage.out' -covermode=atomic ./...
      - name: Test optional mixed stack
        run: go test -tags with_gvisor -race -count=1 ./...
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out

  coverage:
    name: Coverage must not decrease
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v8.0.2
        with:
          name: coverage-windows-latest
          path: .coverage-head
      - name: Check out exact PR base
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: .coverage-base
          persist-credentials: false
      - name: Measure base with the same toolchain and flags
        working-directory: .coverage-base
        run: go test -race -count=1 '-coverpkg=./...' '-coverprofile=../coverage-base.out' -covermode=atomic ./...
      - name: Reject coverage regression
        run: go run ./cmd/covercheck -base coverage-base.out -head .coverage-head/coverage.out
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-comparison
          path: |
            coverage-base.out
            .coverage-head/coverage.out
          include-hidden-files: true

  build:
    name: Build all supported targets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Check formatting and module files
        run: |
          test -z "$(gofmt -l cmd pkg test)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Cross compile
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              suffix=""
              if [ "$os" = windows ]; then suffix=".exe"; fi
              GOOS="$os" GOARCH="$arch" go build -tags with_gvisor -trimpath -o "dist/kone-$os-$arch$suffix" ./cmd/kone
            done
          done
          GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -o dist/kone-linux-armv7 ./cmd/kone
          cp LICENSE LICENSE-MIT THIRD_PARTY_NOTICES.md dist/
          cp -R licenses dist/
      - name: Bundle corresponding source and dependency notices
        run: |
          mkdir -p "$RUNNER_TEMP/kone-source"
          git archive HEAD | tar -xf - -C "$RUNNER_TEMP/kone-source"
          go mod vendor -o "$RUNNER_TEMP/kone-source/vendor"
          tar -czf dist/kone-source.tar.gz -C "$RUNNER_TEMP/kone-source" .
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: binaries
          path: dist/

  robustness:
    name: Fuzz and vulnerability checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./pkg/tcpip -run '^$' -fuzz '^FuzzParseIPv4$' -fuzztime 15s
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  docker:
    name: Container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build -f deploy/docker/Dockerfile -t kone:ci .
      - run: docker run --rm kone:ci -check -config /etc/kone/config.toml

  system:
    name: Linux TUN lifecycle and fault injection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Build system tests and CLI
        run: |
          go build -tags with_gvisor -race -o "$RUNNER_TEMP/kone-system-cli" ./cmd/kone
          go test -tags with_gvisor -race -c -o "$RUNNER_TEMP/kone-system.test" ./test/integration
      - name: Test real TUN in isolated network namespace
        run: |
          for stack in system mixed; do
          sudo unshare --net -- bash -c '
            set -e
            ip link set lo up
            export KONE_SYSTEM_TEST=1
            export KONE_SYSTEM_CLI="$1"
            export KONE_TEST_STACK="$3"
            "$2" -test.run "^TestSystem(Lifecycle|Gateway)" -test.v -test.timeout 180s
          ' -- "$RUNNER_TEMP/kone-system-cli" "$RUNNER_TEMP/kone-system.test" "$stack"
          done

  windows-system:
    name: Windows Wintun lifecycle and traffic
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: '1'
      KONE_WINDOWS_SYSTEM_TEST: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test embedded Wintun without TAP installation
        run: go test -tags with_gvisor -race -count=1 -timeout 12m -run '^TestSystemWindowsWintun$' -v ./test/integration
