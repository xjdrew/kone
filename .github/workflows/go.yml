name: Go

# master pushes are qualified once per SHA by release.yml through workflow_call.
on:
  pull_request:
    branches: [master]
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      version:
        type: string
        default: ''
      artifact-prefix:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.run_id, inputs.ref || github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Management UI and browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: npm ci
      - run: npm test
      - name: Test release identity, batched commits and safety guards
        run: node --test ../test/release/*.test.mjs
      - name: Verify GeoIP conversion boundaries and provenance
        run: node --test ../scripts/data/*.test.mjs
      - run: npm run build
      - name: Verify embedded assets match frontend sources
        run: git diff --exit-code -- dist
      - name: Build genuine management browser fixture
        working-directory: .
        run: |
          go build -o "$RUNNER_TEMP/kone-management-ui" ./cmd/kone
          printf 'KONE_MANAGEMENT_TEST_BINARY=%s/kone-management-ui\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium webkit firefox
      - name: Test browser journeys with real management and enforce execution
        run: |
          npx playwright test --project=chromium-1440x900 --grep '@real' --list
          npm run test:e2e
          node e2e/assert-real-results.mjs test-results/results.json
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: ${{ inputs.artifact-prefix }}management-ui-browser-results
          overwrite: true
          path: |
            web/test-results/
            web/playwright-report/

  test:
    name: Platform tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify module checksums
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        shell: pwsh
        run: |
          $packages = (go list ./...) -join ','
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -race -count=1 "-coverpkg=$packages" '-coverprofile=coverage.out' -covermode=atomic ./...
      - name: Test optional mixed stack
        run: go test -tags with_gvisor -race -count=1 ./...
      - name: Regress upstream PE loader pointer bounds
        if: ${{ matrix.os == 'windows-latest' }}
        run: go test -race -count=1 github.com/sagernet/sing-tun/internal/wintun github.com/sagernet/sing-tun/internal/wintun/memmod
      - name: Validate macOS AppKit and private helper boundaries
        if: matrix.os == 'macos-latest'
        run: go test -v -count=1 ./pkg/desktop -run '^TestDarwin(NativeTray(Selectors|PipeEOF)|AuthenticatedPrivateHelperLifecycleWithoutNetworkChanges)$'
      - name: Check out exact PR base for coverage
        if: ${{ matrix.os == 'windows-latest' && github.event_name == 'pull_request' }}
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: .coverage-base
          persist-credentials: false
      - name: Measure fresh base with the same toolchain and flags
        if: ${{ matrix.os == 'windows-latest' && github.event_name == 'pull_request' }}
        working-directory: .coverage-base
        shell: pwsh
        run: |
          $packages = (go list ./...) -join ','
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -race -count=1 "-coverpkg=$packages" '-coverprofile=../coverage-base.out' -covermode=atomic ./...
      - name: Reject coverage regression
        if: ${{ matrix.os == 'windows-latest' && github.event_name == 'pull_request' }}
        run: go run ./cmd/covercheck -base coverage-base.out -head coverage.out
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() && matrix.os == 'windows-latest' && github.event_name == 'pull_request' }}
        with:
          name: coverage-comparison
          overwrite: true
          path: |
            coverage-base.out
            coverage.out
      - name: Build native utun acceptance binary
        if: ${{ !cancelled() && matrix.os == 'macos-latest' }}
        run: |
          go test -tags with_gvisor -race -c -o "$RUNNER_TEMP/kone-darwin-system.test" ./test/integration
          go test -tags with_gvisor -race -c -o "$RUNNER_TEMP/kone-darwin-dns-session.test" ./pkg/kone
          "$RUNNER_TEMP/kone-darwin-system.test" -test.list '^TestSystemDarwinUTUN$' | grep -qx TestSystemDarwinUTUN
          "$RUNNER_TEMP/kone-darwin-system.test" -test.list '^TestSystemDarwinDNSGuidance$' | grep -qx TestSystemDarwinDNSGuidance
          "$RUNNER_TEMP/kone-darwin-dns-session.test" -test.list '^TestDarwinOwnedSystemDNSSessionDeath$' | grep -qx TestDarwinOwnedSystemDNSSessionDeath
      - name: Exercise owned utun and temporary system DNS lifecycle
        if: ${{ !cancelled() && matrix.os == 'macos-latest' }}
        run: sudo -n env KONE_DARWIN_SYSTEM_TEST=1 KONE_DARWIN_DNS_SYSTEM_TEST=1 "$RUNNER_TEMP/kone-darwin-system.test" -test.run '^TestSystemDarwin(UTUN|DNSGuidance)$' -test.v -test.timeout 5m
      - name: Verify configd removes a dead owned DNS session automatically
        if: ${{ !cancelled() && matrix.os == 'macos-latest' }}
        run: sudo -n env KONE_DARWIN_DNS_SYSTEM_TEST=1 "$RUNNER_TEMP/kone-darwin-dns-session.test" -test.run '^TestDarwinOwnedSystemDNSSessionDeath$' -test.v -test.timeout 1m
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: ${{ inputs.artifact-prefix }}coverage-${{ matrix.os }}
          overwrite: true
          path: coverage.out

  build:
    name: Cross-build and Linux packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            .github/workflows/go.yml
            scripts/release/build-info.mjs
      - name: Cross compile
        env:
          CGO_ENABLED: '0'
          KONE_VERSION: ${{ inputs.version || format('0.4.0-dev.{0}', github.sha) }}
        run: |
          set -euo pipefail
          mkdir -p dist
          build_target() {
            local target="$1" os="${1%%/*}" arch="${1##*/}" suffix=""
            local flags=()
            if [ "$os" = windows ]; then suffix=".exe"; fi
            if [ "$arch" = arm ]; then
              target="$os-armv7"
            else
              target="$os-$arch"
              flags=(-tags with_gvisor)
            fi
            printf 'Compiling %s\n' "$target"
            GOOS="$os" GOARCH="$arch" GOARM=7 go build "${flags[@]}" -trimpath -ldflags="-X main.VERSION=$KONE_VERSION" -o "dist/kone-$target$suffix" ./cmd/kone
          }
          export -f build_target
          printf '%s\n' linux/amd64 linux/arm64 linux/arm darwin/amd64 darwin/arm64 windows/amd64 windows/arm64 | xargs -n 1 -P 2 bash -c 'build_target "$1"' _
          cp LICENSE LICENSE-MIT dist/
          cp -R licenses dist/
          node scripts/release/build-info.mjs
      - name: Bundle corresponding source and dependency notices
        run: |
          mkdir -p "$RUNNER_TEMP/kone-source"
          git archive HEAD | tar -xf - -C "$RUNNER_TEMP/kone-source"
          go mod vendor -o "$RUNNER_TEMP/kone-source/vendor"
          cp dist/build-info.json "$RUNNER_TEMP/kone-source/BUILD-INFO.json"
          tar -czf dist/kone-source.tar.gz -C "$RUNNER_TEMP/kone-source" .
      - name: Package and validate Linux installation in a temporary prefix
        env:
          RELEASE_INPUT: dist
          RELEASE_SHA: ${{ inputs.ref || github.sha }}
          RELEASE_VERSION: ${{ inputs.version || format('0.4.0-dev.{0}', github.sha) }}
        run: node scripts/release/package.mjs
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}install-packages-ubuntu-latest
          overwrite: true
          path: release-assets/
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}binaries
          path: dist/
          overwrite: true

  packages:
    name: Installable packages (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ inputs.artifact-prefix }}binaries
          path: release-input
      - name: Package and validate installation in a temporary prefix
        env:
          RELEASE_SHA: ${{ inputs.ref || github.sha }}
          RELEASE_VERSION: ${{ inputs.version || format('0.4.0-dev.{0}', github.sha) }}
        run: node scripts/release/package.mjs
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}install-packages-${{ matrix.os }}
          overwrite: true
          path: release-assets/

  quality:
    name: Quality and performance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            .github/workflows/go.yml
            pkg/kone/core_benchmark_test.go
      - name: Check formatting and module files
        run: |
          test -z "$(gofmt -l cmd pkg test web/embed.go)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: go test ./pkg/kone -run '^$' -fuzz '^FuzzParseConfig$' -fuzztime 15s
      - name: Check reachable dependency vulnerabilities
        if: ${{ !cancelled() }}
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Record hardware, toolchain and benchmark inputs
        if: ${{ !cancelled() }}
        run: |
          mkdir -p baseline
          node -e 'const fs=require("node:fs"),os=require("node:os"),cp=require("node:child_process"); fs.writeFileSync("baseline/environment.json", JSON.stringify({sha:cp.execFileSync("git",["rev-parse","HEAD"],{encoding:"utf8"}).trim(),time:new Date().toISOString(),os:os.platform(),release:os.release(),arch:os.arch(),cpu:os.cpus()[0]?.model,logical_cpus:os.cpus().length,memory_bytes:os.totalmem(),concurrency:[1,2],samples:3,benchtime:"500ms",datasets:"deterministic fixtures in benchmark source at this SHA",network:"stack-independent core fixtures; actual TUN is sampled separately"},null,2)+"\n")'
          go version > baseline/toolchain.txt
          go env GOOS GOARCH GOVERSION CGO_ENABLED >> baseline/toolchain.txt
      - name: Measure stack-independent algorithms and retain matching profiles
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          go test -run '^TestBundledDatasetStartupMemoryAndPublicQueryConsistency$' -v ./pkg/geoip | tee baseline/geoip-startup.txt
          go test ./pkg/kone -run '^$' -bench . -benchmem -benchtime=500ms -count=3 -cpu=1,2 | tee baseline/core.txt
          go test ./pkg/geoip -run '^$' -bench . -benchmem -benchtime=500ms -count=3 -cpu=1,2 | tee baseline/geoip.txt
          grep -q '^Benchmark' baseline/core.txt
          grep -q '^Benchmark' baseline/geoip.txt
          go test ./pkg/kone -run '^$' -bench '^BenchmarkObservationQueries$' -benchmem -benchtime=1s -count=1 -cpu=2 -cpuprofile=baseline/cpu.out -memprofile=baseline/memory.out -o baseline/kone.test > baseline/profile.txt
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: ${{ inputs.artifact-prefix }}performance-baseline
          overwrite: true
          path: baseline/

  linux-system:
    name: Linux system and interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Build system tests and CLI
        run: |
          go build -tags with_gvisor -race -o "$RUNNER_TEMP/kone-system-cli" ./cmd/kone
          go test -tags with_gvisor -race -c -o "$RUNNER_TEMP/kone-system.test" ./test/integration
      - name: Test real TUN in isolated network namespace
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/native-data-plane-baseline"
          mkdir -p "$baseline"
          {
            git rev-parse HEAD
            go version
            uname -a
            getconf _NPROCESSORS_ONLN
            lscpu
            head -n 5 /proc/meminfo
            printf 'build flags: with_gvisor -race; namespaces: isolated per stack\n'
          } > "$baseline/environment.txt"
          for stack in system mixed; do
          sudo unshare --net -- bash -c '
            set -e
            ip link set lo up
            export KONE_SYSTEM_TEST=1
            export KONE_SYSTEM_CLI="$1"
            export KONE_TEST_STACK="$3"
            "$2" -test.run "^TestSystem(Lifecycle|Gateway|DNS|IPv6|Performance)" -test.v -test.timeout 180s
          ' -- "$RUNNER_TEMP/kone-system-cli" "$RUNNER_TEMP/kone-system.test" "$stack" | tee "$baseline/$stack.log"
          done
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: ${{ inputs.artifact-prefix }}native-data-plane-baseline
          path: ${{ runner.temp }}/native-data-plane-baseline
          if-no-files-found: error
          overwrite: true

      - name: Verify isolated resolver tools are available
        if: ${{ !cancelled() }}
        run: |
          command -v busctl
          command -v resolvectl
          command -v dbus-daemon
          test -x /usr/lib/systemd/systemd-resolved
      - name: Exercise OS DNS in private mount, network and D-Bus contexts
        if: ${{ !cancelled() }}
        run: |
          sudo env KONE_SYSTEM_DNS_TEST=1 unshare --mount --net --propagation private --fork -- bash scripts/test-system-dns.sh "$RUNNER_TEMP/kone-system.test"

      - name: Test digest-pinned shadowsocks-rust over isolated loopback
        if: ${{ !cancelled() }}
        run: bash scripts/test-shadowsocks-interop.sh
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: ${{ inputs.artifact-prefix }}shadowsocks-interoperability
          overwrite: true
          path: |
            ${{ runner.temp }}/kone-shadowsocks-interop/results.json
            ${{ runner.temp }}/kone-shadowsocks-interop/server.log
            ${{ runner.temp }}/kone-shadowsocks-interop/test.log
            ${{ runner.temp }}/kone-shadowsocks-interop/image.json

      - name: Build container from source
        id: container-build
        if: ${{ !cancelled() }}
        run: docker build -f deploy/docker/Dockerfile -t kone:ci .
      - name: Validate container configuration without privileges
        if: ${{ !cancelled() && steps.container-build.outcome == 'success' }}
        run: docker run --rm kone:ci -check -config /etc/kone/config.toml

  windows-system:
    name: Windows Wintun (${{ matrix.stack }})
    strategy:
      fail-fast: false
      matrix:
        stack: [system, mixed]
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: '1'
      KONE_WINDOWS_SYSTEM_TEST: '1'
      KONE_TEST_STACK: ${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Exercise the selected stack and require all six native cases
        shell: pwsh
        run: |
          $pattern = '^TestSystemWindows(Wintun|IPv6Wintun)$/^' + $env:KONE_TEST_STACK + '$'
          go test -tags with_gvisor -race -failfast -count=1 -timeout 12m -run $pattern -json ./test/integration | Tee-Object -FilePath native-windows.jsonl
          $result = $LASTEXITCODE
          $events = Get-Content native-windows.jsonl | ConvertFrom-Json
          $events | Where-Object Output | ForEach-Object { Write-Host -NoNewline $_.Output }
          if ($result -ne 0) { exit $result }
          $passed = @($events | Where-Object { $_.Action -eq 'pass' } | ForEach-Object Test)
          $stack = $env:KONE_TEST_STACK
          foreach ($case in @('traffic','udp6_rollback','tcp6_rollback','route_rollback')) {
            if ($passed -notcontains "TestSystemWindowsIPv6Wintun/$stack/$case") { throw "Missing actual IPv6 pass: $stack/$case" }
          }
          foreach ($occupied in @('true','false')) {
            if ($passed -notcontains "TestSystemWindowsWintun/$stack/occupied=$occupied") { throw "Missing actual IPv4 pass: $stack/occupied=$occupied" }
          }
          $other = if ($stack -eq 'system') { 'mixed' } else { 'system' }
          if (@($events | Where-Object { $_.Test -match "^TestSystemWindows(Wintun|IPv6Wintun)/$other/" }).Count -ne 0) { throw 'Unexpected stack executed on this runner' }
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: ${{ inputs.artifact-prefix }}windows-native-${{ matrix.stack }}
          overwrite: true
          path: native-windows.jsonl

  verified:
    name: Required gates verified (${{ inputs.ref || github.sha }})
    if: ${{ !cancelled() && inputs.ref != '' && needs.web.result == 'success' && needs.test.result == 'success' && needs.build.result == 'success' && needs.packages.result == 'success' && needs.quality.result == 'success' && needs.linux-system.result == 'success' && needs.windows-system.result == 'success' }}
    needs: [web, test, build, packages, quality, linux-system, windows-system]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Record exact successful SHA and gates
        env:
          RELEASE_SHA: ${{ inputs.ref }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/release/marker.mjs
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}verification
          path: verification/verification.json
          overwrite: true
