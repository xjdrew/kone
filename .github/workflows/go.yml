name: Go

# master pushes are qualified once per SHA by release.yml through workflow_call.
on:
  pull_request:
    branches: [master]
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      version:
        type: string
        default: ''
      artifact-prefix:
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.run_id, inputs.ref || github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Pin command definitions separately when qualifying an older source SHA.
defaults:
  run:
    shell: bash

env:
  JUST_JUSTFILE: ${{ inputs.ref != '' && format('{0}/.ci-tools/justfile', github.workspace) || format('{0}/justfile', github.workspace) }}
  JUST_WORKING_DIRECTORY: ${{ github.workspace }}

jobs:
  web:
    name: Management UI and browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Check out workflow task definitions
        if: ${{ inputs.ref != '' }}
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tools
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: just ci web-deps
      - run: just ci test-web
      - name: Test release identity, batched commits and safety guards
        run: just ci test-release
      - name: Verify GeoIP conversion boundaries and provenance
        run: just ci test-data
      - name: Verify generated application icons and Windows resources
        if: ${{ hashFiles('cmd/kone-cli/main.go') != '' }}
        run: just ci icons check
      - run: just ci web-build
      - name: Verify embedded assets match frontend sources
        run: just ci web-check
      - name: Build genuine management browser fixture
        working-directory: .
        run: just ci ci-web-fixture
      - run: just ci web-browsers
      - name: Test browser journeys with real management and enforce execution
        run: just ci test-web-e2e
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: ${{ inputs.artifact-prefix }}management-ui-browser-results
          overwrite: true
          path: |
            web/test-results/
            web/playwright-report/

  test:
    name: Platform tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Check out workflow task definitions
        if: ${{ inputs.ref != '' }}
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tools
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify module checksums
        run: just ci go-verify
      - name: Vet
        run: just ci vet
      - name: Test with race detector
        run: just ci test-coverage
      - name: Regress upstream PE loader pointer bounds
        if: ${{ matrix.os == 'windows-latest' }}
        run: just ci test-pe
      - name: Regress Windows packaging without PowerShell 7
        if: ${{ matrix.os == 'windows-latest' }}
        run: just ci test-windows-package
      - name: Validate macOS AppKit and private helper boundaries
        if: matrix.os == 'macos-latest'
        run: just ci test-macos-desktop
      - name: Check out exact PR base for coverage
        if: ${{ matrix.os == 'windows-latest' && github.event_name == 'pull_request' }}
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: .coverage-base
          persist-credentials: false
      - name: Measure fresh base with the same toolchain and flags
        if: ${{ matrix.os == 'windows-latest' && github.event_name == 'pull_request' }}
        run: just ci test-coverage .coverage-base ../coverage-base.out
      - name: Reject coverage regression
        if: ${{ matrix.os == 'windows-latest' && github.event_name == 'pull_request' }}
        run: just ci coverage-check
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() && matrix.os == 'windows-latest' && github.event_name == 'pull_request' }}
        with:
          name: coverage-comparison
          overwrite: true
          path: |
            coverage-base.out
            coverage.out
      - name: Build native utun acceptance binary
        if: ${{ !cancelled() && matrix.os == 'macos-latest' }}
        run: just ci ci-macos-build
      - name: Exercise owned utun and temporary system DNS lifecycle
        if: ${{ !cancelled() && matrix.os == 'macos-latest' }}
        run: just ci ci-macos-tun
      - name: Verify configd removes a dead owned DNS session automatically
        if: ${{ !cancelled() && matrix.os == 'macos-latest' }}
        run: just ci ci-macos-session
      - name: Build Linux native acceptance binaries once
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        run: just ci ci-linux-build
      - name: Exercise every supported stack in isolated Linux network namespaces
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        run: just ci ci-linux-tun
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        with:
          name: ${{ inputs.artifact-prefix }}native-data-plane-baseline
          path: ${{ runner.temp }}/native-data-plane-baseline
          if-no-files-found: error
          overwrite: true
      - name: Verify isolated resolver tools
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        run: just ci ci-linux-dns-tools
      - name: Exercise OS DNS in private mount, network and D-Bus contexts
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        run: just ci ci-linux-dns
      - name: Test digest-pinned shadowsocks-rust over isolated loopback
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        run: just ci ci-ss
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        with:
          name: ${{ inputs.artifact-prefix }}shadowsocks-interoperability
          overwrite: true
          path: |
            ${{ runner.temp }}/kone-shadowsocks-interop/results.json
            ${{ runner.temp }}/kone-shadowsocks-interop/server.log
            ${{ runner.temp }}/kone-shadowsocks-interop/test.log
            ${{ runner.temp }}/kone-shadowsocks-interop/image.json
      - name: Build container from source
        id: container-build
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        run: just ci docker-build
      - name: Validate container configuration without privileges
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && steps.container-build.outcome == 'success' }}
        run: just ci docker-check
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: ${{ inputs.artifact-prefix }}coverage-${{ matrix.os }}
          overwrite: true
          path: coverage.out
      # Unit/native checks start alongside cross-builds. Only packaging waits;
      # a current-attempt build failure cannot reuse an earlier binary artifact.
      - name: Wait for this source and attempt's package input
        id: package-input
        if: ${{ !cancelled() && matrix.os != 'ubuntu-latest' }}
        env:
          GH_TOKEN: ${{ github.token }}
          KONE_BUILD_SHA: ${{ inputs.ref || github.sha }}
        run: just ci wait-build
      - uses: actions/download-artifact@v8.0.2
        id: package-download
        if: ${{ !cancelled() && matrix.os != 'ubuntu-latest' && steps.package-input.outcome == 'success' }}
        with:
          name: ${{ inputs.artifact-prefix }}binaries
          path: release-input
      - name: Package and validate the native installation without rebuilding
        id: native-package
        if: ${{ !cancelled() && matrix.os != 'ubuntu-latest' && steps.package-download.outcome == 'success' }}
        env:
          RELEASE_SHA: ${{ inputs.ref || github.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: just ci package
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() && matrix.os != 'ubuntu-latest' && steps.native-package.outcome == 'success' }}
        with:
          name: ${{ inputs.artifact-prefix }}install-packages-${{ matrix.os }}
          overwrite: true
          path: release-assets/

  build:
    name: Cross-build and Linux packages (${{ inputs.ref || github.sha }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Check out workflow task definitions
        if: ${{ inputs.ref != '' }}
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tools
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            .github/workflows/go.yml
            scripts/release/build-info.mjs
            justfile
            scripts/ci/justfile
            scripts/ci/build-all.sh
      - name: Cross compile
        env:
          CGO_ENABLED: '0'
          KONE_VERSION: ${{ inputs.version }}
        run: just ci build-all
      - name: Bundle corresponding source and dependency notices
        run: just ci source-bundle
      - name: Package and validate Linux installation in a temporary prefix
        env:
          RELEASE_INPUT: dist
          RELEASE_SHA: ${{ inputs.ref || github.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: just ci package
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}install-packages-ubuntu-latest
          overwrite: true
          path: release-assets/
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}binaries
          path: dist/
          overwrite: true

  quality:
    name: Quality and performance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Check out workflow task definitions
        if: ${{ inputs.ref != '' }}
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tools
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            .github/workflows/go.yml
            pkg/kone/core_benchmark_test.go
            justfile
            scripts/ci/justfile
            scripts/ci/benchmark.sh
      - name: Check formatting and module files
        run: just ci quality-check
      - run: just ci fuzz
      - name: Check reachable dependency vulnerabilities
        if: ${{ !cancelled() }}
        run: just ci vuln
      - name: Record hardware, toolchain and benchmark inputs
        if: ${{ !cancelled() }}
        run: just ci benchmark-metadata
      - name: Measure stack-independent algorithms and retain matching profiles
        if: ${{ !cancelled() }}
        run: just ci benchmark
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: ${{ inputs.artifact-prefix }}performance-baseline
          overwrite: true
          path: baseline/

  windows-native:
    name: Windows Wintun (${{ matrix.stack }})
    strategy:
      fail-fast: false
      matrix:
        stack: [system, gvisor, mixed]
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: '1'
      KONE_WINDOWS_SYSTEM_TEST: '1'
      KONE_TEST_STACK: ${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Check out workflow task definitions
        if: ${{ inputs.ref != '' }}
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tools
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Require the selected stack's six real native cases
        run: just ci ci-windows-tun
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() && (matrix.stack != 'gvisor' || hashFiles('pkg/kone/stack_modes.go') != '') }}
        with:
          name: ${{ inputs.artifact-prefix }}windows-native-${{ matrix.stack }}
          overwrite: true
          path: native-windows-${{ matrix.stack }}.jsonl
          if-no-files-found: error

  verified:
    name: Required gates verified (${{ inputs.ref || github.sha }})
    if: ${{ !cancelled() && inputs.ref != '' && needs.web.result == 'success' && needs.test.result == 'success' && needs.build.result == 'success' && needs.quality.result == 'success' && needs.windows-native.result == 'success' }}
    needs: [web, test, build, quality, windows-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Check out workflow task definitions
        if: ${{ inputs.ref != '' }}
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tools
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'
      - name: Record exact successful SHA and gates
        env:
          RELEASE_SHA: ${{ inputs.ref }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: just ci release-marker
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}verification
          path: verification/verification.json
          overwrite: true
