# Copy to config.toml and replace the example proxy endpoint before running.
[general]
manager-addr = "127.0.0.1:9200" # empty string disables the manager
log-level = "info" # debug, info, warn, error
log-format = "text" # text or json; logs go to stderr

[core]
network = "10.192.0.1/16"
# tun = "kone0" # new device name; macOS requires utunN; never reuse an existing adapter
stack = "system" # "mixed" needs a build with -tags with_gvisor
auto-route = false # true captures IPv4 traffic; requires the physical outbound interface
# outbound-interface = "eth0" # e.g. eth0 on Raspberry Pi or Ethernet on Windows
# Explicit upstreams make this example reproducible. Omit to use system DNS.
dns-server = ["1.1.1.1", "8.8.8.8:53"]
dns-ttl = 600
dns-packet-size = 4096
dns-read-timeout = 5
dns-write-timeout = 5
# Old tcp/udp listener and NAT port options are accepted for config compatibility;
# sing-tun now owns transparent listeners and session allocation.
dns-listen-port = 53

[proxies]
Proxy1 = "http://127.0.0.1:8080"
# Proxy2 = "socks5://127.0.0.1:1080"
# Secure = "https://username:password@example.com:443"

# Rules are evaluated in order. FINAL is optional and must be last.
[[rules]]
type = "IP-CIDR"
pattern = "192.168.0.0/16"
proxy = "DIRECT"

[[rules]]
type = "DOMAIN-SUFFIX"
pattern = "example.com"
proxy = "Proxy1"

[[rules]]
type = "FINAL"
proxy = "DIRECT"
